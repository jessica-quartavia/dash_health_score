# Monitoramento HS — GitHub Actions (Etapa 13.2). Pipeline Node + Business Data.
name: Monitoring pipeline

on:
  workflow_dispatch:
    inputs:
      reference_date:
        description: "YYYY-MM-DD (opcional)"
        required: false
      force:
        description: "Regravar snapshot do dia (true/false)"
        required: false
        default: "false"
  # Ativar SOMENTE após workflow_dispatch manual OK (Etapa 13.2):
  # schedule:
  #   - cron: "0 9 1 * *"

permissions:
  contents: read

concurrency:
  group: hs-monitoring-pipeline
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Verify Business Data configuration
        env:
          DATA_SUPABASE_URL: ${{ secrets.DATA_SUPABASE_URL }}
          DATA_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.DATA_SUPABASE_SERVICE_ROLE_KEY }}
          BUSINESS_SUPABASE_URL: ${{ secrets.BUSINESS_SUPABASE_URL }}
          BUSINESS_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.BUSINESS_SUPABASE_SERVICE_ROLE_KEY }}
          HS_MONITORING_PSEUDONYM_SECRET: ${{ secrets.HS_MONITORING_PSEUDONYM_SECRET }}
        run: npm run monitoring:check-bd

      - name: Run monitoring pipeline (persist Business Data)
        env:
          DATA_SUPABASE_URL: ${{ secrets.DATA_SUPABASE_URL }}
          DATA_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.DATA_SUPABASE_SERVICE_ROLE_KEY }}
          BUSINESS_SUPABASE_URL: ${{ secrets.BUSINESS_SUPABASE_URL }}
          BUSINESS_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.BUSINESS_SUPABASE_SERVICE_ROLE_KEY }}
          HS_MONITORING_PSEUDONYM_SECRET: ${{ secrets.HS_MONITORING_PSEUDONYM_SECRET }}
          HS_MONITORING_PERSIST_BUSINESS_DATA: "1"
        run: |
          set -euo pipefail
          ARGS="--persist-business-data"
          if [ -n "${{ inputs.reference_date }}" ]; then ARGS="$ARGS --reference-date=${{ inputs.reference_date }}"; fi
          if [ "${{ inputs.force }}" = "true" ]; then ARGS="$ARGS --force"; fi
          node scripts/run-monitoring-pipeline.mjs $ARGS

      - name: Verify Business Data counts
        env:
          DATA_SUPABASE_URL: ${{ secrets.DATA_SUPABASE_URL }}
          DATA_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.DATA_SUPABASE_SERVICE_ROLE_KEY }}
          BUSINESS_SUPABASE_URL: ${{ secrets.BUSINESS_SUPABASE_URL }}
          BUSINESS_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.BUSINESS_SUPABASE_SERVICE_ROLE_KEY }}
          HS_MONITORING_PSEUDONYM_SECRET: ${{ secrets.HS_MONITORING_PSEUDONYM_SECRET }}
        run: node scripts/verify-bd-after-pipeline.mjs

      - name: Upload run metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hs-monitoring-${{ github.run_id }}
          path: |
            research/monitoring/output/pipeline_last_run.json
            research/monitoring/runs/run-log.json
          retention-days: 30
          if-no-files-found: ignore
